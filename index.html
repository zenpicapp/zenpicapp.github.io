<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ZenPic · 淘片</title>
<style>
:root {
  color-scheme: light dark;
  --background: #f8f6f1;
  --text: #252720;
  --secondary: #62675d;
  --border: #d9dccf;
  --link: #3a623d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #171a16;
    --text: #eceee7;
    --secondary: #b3bcaa;
    --border: #3a4335;
    --link: #b6d29d;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: system-ui, sans-serif;
  line-height: 1.65;
  overflow-wrap: anywhere;
}
main {
  width: min(100%, 720px);
  margin: 0 auto;
  padding: clamp(32px, 8vw, 104px) 20px 48px;
}
h1 {
  font-size: clamp(2.25rem, 7vw, 3.75rem);
  line-height: 1.15;
  margin: 0 0 20px;
}
p { margin: 0 0 10px; }
.intro { font-size: clamp(1.1rem, 2.5vw, 1.25rem); }
.availability { margin-top: 22px; color: var(--secondary); }
.availability span { display: block; }
nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 22px;
  margin-top: 26px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
@media (max-width: 420px) {
  nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
a { color: var(--link); text-underline-offset: 3px; }
.contact { margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>ZenPic <span lang="zh-Hans">淘片</span></h1>
  <p class="intro">Sort photos, organize albums and make room on your iPhone. Photo analysis happens on your device.</p>
  <p class="intro" lang="zh-Hans">整理照片、归类相簿，给 iPhone 腾出空间。照片分析在手机上完成。</p>
  <p class="availability">Coming to the App Store. <span lang="zh-Hans">即将在 App Store 上架。</span></p>
  <nav aria-label="Privacy and support">
    <a href="/privacy/">Privacy Policy</a>
    <a href="/support/">Support</a>
    <a href="/zh/privacy/" lang="zh-Hans">隐私政策</a>
    <a href="/zh/support/" lang="zh-Hans">技术支持</a>
  </nav>
  <p class="contact"><a href="mailto:61073198@qq.com">61073198@qq.com</a></p>
</main>
</body>
</html>
